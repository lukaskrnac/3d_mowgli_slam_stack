version: "3.8"


services:

    # Dočasný service na test s example.pcap namiesto živého senzora.
  # Vypni "velodyne_driver" (zakomentuj) kým testuješ toto, aby si nekolidovali na UDP porte 2368.
  velodyne_driver:
    image: vlp16_dds:latest   # pomenovanie lokálneho image, nech je to jasné
    container_name: velodyne_vlp16
    network_mode: host                  # VLP16 komunikuje cez UDP na LAN
    environment:
      - CYCLONEDDS_URI=file:///cyclonedds.xml
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROS_DOMAIN_ID=0                 # musí byť rovnaké vo všetkých 3 kontajneroch (aj MowgliNext)
    volumes:
      - /home/mowgli/mowglinext/docker/slam/velodyne/config/VLP16-velodyne_driver_node-params.yaml:/opt/ros/kilted/share/velodyne_driver/config/VLP16-velodyne_driver_node-params.yaml:ro
      - /home/mowgli/mowglinext/docker/config/cyclonedds.xml:/cyclonedds.xml:ro
    restart: unless-stopped
    command: >
      bash -c "source /opt/ros/kilted/setup.bash &&
               ros2 launch velodyne velodyne-all-nodes-VLP16-launch.py"
               
  velodyne_pcap_test:
    image: vlp16_dds:latest   # rovnaký image ako velodyne_driver, nič nové sa nebuilduje
    container_name: velodyne_pcap_test
    network_mode: host
    environment:
      - CYCLONEDDS_URI=file:///cyclonedds.xml
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROS_DOMAIN_ID=0    
    volumes:
      - /home/mowgli/mowglinext/docker/slam/example.pcap:/data/example.pcap:ro   # daj sem cestu k svojmu example.pcap súboru
      - /home/mowgli/mowglinext/docker/slam/run_pcap.sh:/opt/run_pcap.sh:ro
      - /home/mowgli/mowglinext/docker/config/cyclonedds.xml:/cyclonedds.xml:ro
    command: bash /opt/run_pcap.sh



  glim:
    image: glim_dds:latest     # BEZ CUDA - výrazne menší image. Ak máš NVIDIA GPU a chceš zrýchlenie, prepni na jazzy_cuda13.1 (ale ráta s +3-4 GB navyše)
    container_name: glim_slam
    network_mode: host
    environment:
      - CYCLONEDDS_URI=file:///cyclonedds.xml
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROS_DOMAIN_ID=0
      - DISPLAY=:0
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/root/.Xauthority
      # NOVÉ - toto rieši nájdenie .so súboru cez dlopen(). ROS setup.bash (spustený v entrypointe image) toto k existujúcemu LD_LIBRARY_PATH
      # PRIDÁ (nie prepíše), takže ostatné .so ako libmemory_monitor.so
      # ostanú nájditeľné ako doteraz.
      - LD_LIBRARY_PATH=/glim_ext_modules
      # NOVÉ - cesta, odkiaľ si RelocalizationModule pri štarte prečíta svoj vlastný config_relocalization.json (kód číta presne tento env var).
      - GLIM_RELOCALIZATION_CONFIG=/glim/config/config_relocalization.json
    ipc: host
    pid: host
    devices:
      - /dev/dri:/dev/dri   # hardvérová OpenGL akcelerácia cez Mesa (AMD/Intel iGPU)
    volumes:
      - /home/mowgli/mowglinext/docker/slam/glim_config:/glim/config      # tvoj upravený config
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /run/user/1000/gdm/Xauthority:/root/.Xauthority:ro
      - /home/mowgli/mowglinext/docker/config/cyclonedds.xml:/cyclonedds.xml:ro
      # NOVÉ - priečinok s libglim_relocalization.so (stiahnutým z GitHub Actions artifact).
      # Mountujeme CELÝ PRIEČINOK, nie len súbor - jednoduchšie sa dopĺňajú ďalšie moduly neskôr.
      - /home/mowgli/mowglinext/docker/slam/glim_ext_modules:/glim_ext_modules:ro
      # NOVÉ - referenčná (prebuilt) mapa, na ktorú sa modul relokalizuje.
      # Cesta VPRAVO musí presne sedieť s "map_path" v config_relocalization.json!
      - /home/mowgli/mowglinext/docker/slam/glim_maps/garden_map:/glim/maps/garden_map:ro
      # cesta ku ulozenej mape po ukoncieni
      - /home/mowgli/mowglinext/docker/slam/glim_dump:/tmp/dump
    restart: unless-stopped
    command: ros2 run glim_ros glim_rosnode --ros-args -p config_path:=/glim/config


  lidar_localization:
    image: ghcr.io/lukaskrnac/3d_mowgli_slam_stack/lidar_localization:sha-886f67c
    container_name: lidar_localization
    network_mode: host
    environment:
      - CYCLONEDDS_URI=file:///cyclonedds.xml
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROS_DOMAIN_ID=0
    volumes:
      - /home/mowgli/mowglinext/docker/slam/config:/opt/lidarloc_ws/install/lidar_localization_ros2/share/lidar_localization_ros2/param:ro
      - /home/mowgli/mowglinext/docker/slam/glim_dump:/maps/garden_map:ro
      - /home/mowgli/mowglinext/docker/config/cyclonedds.xml:/cyclonedds.xml:ro
      # Upravený launch: TF výstup ide na /lidar_localization/tf (nie /tf), aby
      # nekolidoval s map -> odom z fusion_graph v MowgliNext. Pozri hlavičku súboru.
      - ./lidar_localization/launch/mowgli_lidar_localization.launch.py:/opt/mowgli_launch/mowgli_lidar_localization.launch.py:ro
    restart: unless-stopped
    # Extrinziku base_link -> lidar_link publikuje MowgliNext (URDF, robot_state_publisher,
    # hodnoty lidar_x/y/z/yaw v mowgli_robot.yaml). Tu sa preto žiadny statický TF
    # nepublikuje a VLP16 musí mať frame_id: lidar_link.
    command: >
      bash -c "ros2 launch /opt/mowgli_launch/mowgli_lidar_localization.launch.py
      tf_topic:=/lidar_localization/tf
      enable_map_odom_tf:=false
      publish_lidar_tf:=false
      lidar_frame_id:=lidar_link"
